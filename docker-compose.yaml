services:
  honeypot:
    build: ./honeypot
    container_name: honeypot
    # Host networking so the fake services sit on the machine's LAN IP and
    # the ARP table (for MAC addresses of intruders) is visible.
    network_mode: host
    volumes:
      - ./data:/data                 # events.jsonl + persistent SSH host key
    environment:
      - HA_URL=http://homeassistant.local:8123   # change to your HA IP if needed
      - NOTIFY_TARGETS=              # comma-separated, e.g. notify.mobile_app_my_phone (needs HA_API_URL + HA_TOKEN)
      - HA_API_URL=                  # e.g. http://homeassistant.local:8123
      - HA_TOKEN=                    # long-lived access token (HA profile → Security)
      - WEBHOOK_ID=                  # optional
      - NOTIFY_COOLDOWN=600
      - SSH_PORT=22                  # falls back to SSH_FALLBACK_PORT (2222) if taken
      - TELNET_PORT=23
      - FTP_PORT=21
      - HTTP_PORT=80
      - TRIPWIRE_PORTS=3389,5900,3306
      - IGNORE_IPS=                  # comma-separated, e.g. your network scanner
      - UI_PORT=8199
      - OWN_IP=false                 # own IP needs cap_add NET_ADMIN + SYS_ADMIN, see DOCS.md
    restart: unless-stopped
